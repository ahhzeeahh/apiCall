<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    #indicate{
      top:0;
    }
  .loading{
    height: 13.125rem ;
    overflow: hidden;
    background: no-repeat; 
    object-fit: contain;
    object-position: center;
    background-image: url('https://i.giphy.com/uIJBFZoOaifHf52MER.webp');
    width: 100%;
    background-position: center;
  }
  .carousel-caption{
    width: 100%;
    background-image: linear-gradient(180deg, #000000b3, #000000 180%);
    display: flex;
    justify-content: space-between;
    right: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    }
    .card-body{
      display: flex;
      flex-direction: column;
    }
    .search-input{
      display: flex;
      background-color: #f7f7f7;
      border-bottom: 1px solid;
      
    }
    .widget-search{ 
      width: 100%;
      background-color: #f7f7f7;
      border: none;
    }
  
</style>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Txgio widget Document</title>
</head>

<body>
    
        <div class="card w-25">  
          <h3 class="m-0 text-center"> TxGIO Data Collections</h3>
            <div class="mx-3">
            <select id="optionSel" class="form-select my-3" aria-label="Default select is Newest">
              <option value="-acquisition_date">Newest</option>
              <option value="acquisition_date">Oldest</option>
              <option value="name">A-Z</option>
              <option value="-name">Z-A</option>
            </select>
            </div>
          <div class="loading">
 
              <div id="dataslider" class="carousel slide" data-interval="10000" data-bs-ride="carousel">
                <ul id="indicate" class="carousel-indicators">
                 <!-- .js Instert from Datahub -->
                </ul>
                <div id="js-img-insert" class="carousel-inner">
                <!-- .js Instert from Datahub-->
                    <div class="carousel-item">
                      <a href="https://data.geographic.texas.gov/collection/?c=d0f7da13-ab09-4994-a16f-d52589e2476e" target="_blank">
                        <img class="d-block w-100" src="https://s3.amazonaws.com/data.tnris.org/d0f7da13-ab09-4994-a16f-d52589e2476e/assets/937facca-dde6-487c-852b-ade999f59083.webp">
                      </a>
                      </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#dataslider" data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#dataslider" data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                    </button>
                  </div>
              </div>
 
            <div class="card-body p-3">
              <p class="status"></p>
              <p class=""><em>showing <span id="resultsStart">0</span> of...<span id="resultsCount">0</span></em></p>
              <h6 class="text-center">Search DataHub</h6>
              <form class="p-2">
                <label for="searchBox" class="visually-hidden form-label">Search DataHub collections by keyword</label>
                <div class="search-input">
                <input placeholder="Search collections by keyword" type="search" class="widget-search" id="searchBox" aria-describedby="search">
                  <i class="bi px-2 bi-search"></i>
                
              </div>
                <button id="startSearch" type="submit" class=" mt-3 w-100 btn btn-dark shadow">Search</button>
              </form>
              <a class="p-3 text-center" id="datahubAtag" href="https://data.geographic.texas.gov">Search on TxGIO DataHub ></a>
          </div>
        </div>
<script src="data_card.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
