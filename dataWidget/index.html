<!DOCTYPE html>
<html lang="en">
<head>
  <style>
  .loading{
    overflow: hidden;
    background: no-repeat; 
    object-fit: contain;
    object-position: center;
    background-image: url('https://i.giphy.com/uIJBFZoOaifHf52MER.webp');
    height: 250px;
    background-position: center;
  }
  .banner-bg{
    width: 100%;
    background-image: linear-gradient(180deg, #000000b3, #000000 180%);
    top: 165px !important;
    left: 0 !important;
    bottom: 0 !important;
    }
    
  
</style>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
        <div class="card w-25">  
          <h2 class="m-0 text-center alert-primary"> TxGIO Data Collections</h2>
          <select id="optionSel" class="form-select" aria-label="Default select is Newest">
            <option value="-acquisition_date">Newest</option>
            <option value="acquisition_date">Oldest</option>
            <option value="name">A-Z</option>
            <option value="-name">Z-A</option>
          </select>
  
          <div class="loading">
 
              <div id="dataslider" class="carousel slide" data-interval="10000" data-bs-ride="carousel">
                <!--  <div id="indicate" class="carousel-indicators">
                 .js Instert from Datahub
                </div>-->
                <div id="js-img-insert" class="carousel-inner">
                <!-- .js Instert from Datahub-->
                </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#dataslider" data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#dataslider" data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                    </button>
                  </div>
              </div>
        <hr></hr>
            <div class="card-body p-3">
            <a class="btn btn-primary">search</a>
            </div>
        </div>
<script src="data_card.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
