<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://test.txgio.org/_assets/css/index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Txgio NEW Figma Widgets</title>
    <style>
        .contract-box{
            background: #f2f2f3;
            border-radius: 1rem;
            padding: 20px;
            text-align: center;
            color: var(--blue)
      
        }
        .contract-box:hover{
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            transform: scale(1.02);
            
        }
        .contracts-grid .grid{
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

        }
        .contract-box img{
            width: 100%;
            object-fit: contain;
            background-size: contain;
            background-position: center;
 }

        button.character-element,
        .contract-box a {
            background-color: transparent;
            color: #007DB8;
            text-decoration: underline; 
            border: none
        }
        button.character-element.active{
            color: #ccc;
        }

    </style>
</head>
<body>
    <section class="container-md my-5 dir-contracts-wrapper">
        <h2>Pre-Qualified Geospatial Providers</h2>
        <div class="row align-items-center">
            <div class="col-lg-4">
                <lable>Search Filter</lable>
                <input placeholder="Company Name" type="search" class="form-control widget-search" id="searchBox" aria-describedby="search">
                 
            </div>
            <div class="col-lg-8">
                <div id="alpha-nav" class="character-container pt-3 d-flex">
                    <button class="character-element active" data-filter="All">All</button><button class="character-element" data-filter="A">A</button><button class="character-element" data-filter="B">B</button><button class="character-element" data-filter="C">C</button><button class="character-element" data-filter="D">D</button><button class="character-element" data-filter="E">E</button><button class="character-element" data-filter="F">F</button><button class="character-element" data-filter="G">G</button><button class="character-element" data-filter="H">H</button><button class="character-element" data-filter="I">I</button><button class="character-element" data-filter="J">J</button><button class="character-element" data-filter="K">K</button><button class="character-element" data-filter="L">L</button><button class="character-element" data-filter="M">M</button><button class="character-element" data-filter="N">N</button><button class="character-element" data-filter="O">O</button><button class="character-element" data-filter="P">P</button><button class="character-element" data-filter="Q"  >Q</button><button class="character-element" data-filter="R">R</button><button class="character-element" data-filter="S">S</button><button class="character-element" data-filter="T">T</button><button class="character-element" data-filter="U">U</button><button class="character-element" data-filter="V">V</button><button class="character-element" data-filter="W">W</button><button class="character-element" data-filter="X"  >X</button><button class="character-element" data-filter="Y"  >Y</button><button class="character-element" data-filter="Z"  >Z</button>
                </div>
            </div>

        </div>

        
            <p class="text-center itallic mt-5 display-5" id="status-message">
                <img alt="loading image" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif">
            </p>
            <div class="contracts-grid">
                <div class="grid" id="insertContracts">
                </div>
            </div>

        </div>

    </section>
    
</body>
<script src="test.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
